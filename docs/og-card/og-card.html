<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OG Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f2ec;
      --surface: #fbf9f4;
      --ink: #1a1a1a;
      --ink-2: #55524b;
      --muted: #7a756b;
      --red: #b5271d;
      --rule: rgba(26, 22, 18, 0.16);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
    body {
      font-family: 'Inter', sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      padding: 52px 64px 48px;
      display: grid;
      grid-template-columns: 1fr 336px;
      grid-template-rows: auto 1fr auto;
      column-gap: 64px;
      background:
        radial-gradient(circle at 100% 0%, rgba(181, 39, 29, 0.07), transparent 55%),
        var(--bg);
    }
    .card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 10px;
      background: var(--red);
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .top {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 17px;
      color: var(--red);
      border-bottom: 1px solid var(--rule);
      padding-bottom: 18px;
    }
    .top span:last-child { color: var(--muted); }
    .main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-top: 8px;
    }
    .eyebrow { font-size: 16px; color: var(--muted); margin-bottom: 18px; }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 92px;
      line-height: 0.95;
      letter-spacing: -0.03em;
      color: var(--ink);
    }
    .role {
      margin-top: 30px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 500;
      font-size: 29px;
      letter-spacing: -0.01em;
      color: var(--ink);
      white-space: nowrap;
    }
    .role::before {
      content: '';
      display: inline-block;
      vertical-align: middle;
      width: 12px; height: 12px;
      margin: -4px 14px 0 0;
      border-radius: 50%;
      background: var(--red);
    }
    .role .sep { color: var(--red); }
    .photo {
      grid-row: 2 / 3;
      grid-column: 2;
      align-self: center;
      width: 336px;
      height: 384px;
      border: 1px solid var(--rule);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 18px 30px -18px rgba(26, 22, 18, 0.45);
    }
    .photo img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: 50% 30%;
      display: block;
    }
    .foot {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-top: 1px solid var(--rule);
      padding-top: 18px;
      font-size: 16px;
    }
    .foot dl { display: flex; gap: 44px; }
    .foot dl div { display: flex; gap: 14px; }
    .foot dt { color: var(--muted); }
    .foot dd { color: var(--ink); }
    .url {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: none;
      color: var(--red);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top mono"><span>01 / PROFILE</span><span>AI/ML &middot; Data Engineering</span></div>
    <div class="main">
      <p class="eyebrow mono">Portfolio</p>
      <h1>Nicolo<br>DiFerdinando</h1>
      <p class="role">AI-Driven Solutions Analyst <span class="sep">&middot;</span> PeopleConnect</p>
    </div>
    <div class="photo"><img src="../../images/Nicolo.jpeg" alt=""></div>
    <div class="foot mono">
      <dl>
        <div><dt>LOC</dt><dd>San Diego, CA</dd></div>
        <div><dt>EDU</dt><dd>Cal Poly SLO &middot; B.S. IE</dd></div>
      </dl>
      <span class="url mono">nicolod.org</span>
    </div>
  </div>
</body>
</html>
